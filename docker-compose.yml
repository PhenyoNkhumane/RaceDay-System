
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-RaceDayLocalPass123!}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    depends_on:
      - sqlserver
      - azurite
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RaceDay;User Id=sa;Password=${SQL_PASSWORD:-RaceDayLocalPass123!};TrustServerCertificate=True;Encrypt=False"
      RaceDaySql__ConnectionString: "Server=sqlserver,1433;Database=RaceDay;User Id=sa;Password=${SQL_PASSWORD:-RaceDayLocalPass123!};TrustServerCertificate=True;Encrypt=False"
      Identity__EncryptionKey: "${IDENTITY_ENCRYPTION_KEY:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}"
      Registration__OrganiserCode: "${REGISTRATION_ORGANISER_CODE:-ChooseYourOwnCode}"
      RaceDayStorage__ConnectionString: "${RACEDAY_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;}"
      RaceDayStorage__ContainerName: "${RACEDAY_STORAGE_CONTAINER_NAME:-raceday-images}"
      Database__ApplyMigrationsOnStartup: "true"
      DataProtection__KeysPath: "/app/DataProtection-Keys"
    volumes:
      - dataprotection-keys:/app/DataProtection-Keys
    ports:
      - "5155:8080"

  mvc:
    build:
      context: ./RaceDay.Mvc
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ApiSettings__BaseUrl: "http://api:8080/"
    ports:
      - "8080:8080"

volumes:
  sql_data:
  azurite_data:
  dataprotection-keys:
