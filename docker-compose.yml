
services:
  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      RaceDaySql__ConnectionString: "${RACEDAY_SQL_CONNECTION_STRING:?Set RACEDAY_SQL_CONNECTION_STRING in the root .env file}"
      Identity__EncryptionKey: "${IDENTITY_ENCRYPTION_KEY:?Set IDENTITY_ENCRYPTION_KEY in the root .env file}"
      Registration__OrganiserCode: "${REGISTRATION_ORGANISER_CODE:?Set REGISTRATION_ORGANISER_CODE in the root .env file}"
      RaceDayStorage__ConnectionString: "${RACEDAY_STORAGE_CONNECTION_STRING:?Set RACEDAY_STORAGE_CONNECTION_STRING in the root .env file}"
      RaceDayStorage__ContainerName: "${RACEDAY_STORAGE_CONTAINER_NAME:-raceday-images}"
    volumes:
      - dataprotection-keys:/app/DataProtection-Keys
    ports:
      - "5155:8080"

  mvc:
    build:
      context: ./RaceDay.Mvc
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ApiSettings__BaseUrl: "http://api:8080/"
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  dataprotection-keys:
